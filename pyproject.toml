[build-system]
requires = ["uv_build==0.10.6"]
build-backend = "uv_build"

[project]
name = "roll-sf"
version = "1.0.0"
description = "Roll SF: wheelchair-friendly routes in San Francisco under a maximum uphill grade"
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "aiohttp==3.14.5",
    "fsspec==2026.9.0",
    "geopandas==1.2.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pillow==13.0.0",
    "pyarrow==26.0.0",
    "pyogrio==0.13.0",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "requests==2.34.2",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "pip-audit==2.10.1",
    "playwright==1.64.0",
    "prek==0.5.5",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "ty==0.0.89",
    "zizmor==1.31.1",
]

[project.scripts]
sf-flat-routes = "sf_flat_routes.__main__:main"

[tool.uv.build-backend]
module-name = "sf_flat_routes"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "needs_data: needs the cached lidar and Overture data in data/ (not available in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["notebooks"]
